name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOMAXPROCS: 2
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pins
        run: echo "mise=$(tr -d '[:space:]' < mise-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/downloads
          key: mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          MISE_ALWAYS_KEEP_DOWNLOAD: "1"
        with:
          version: ${{ steps.pins.outputs.mise }}
          cache: false
      - name: frozen dependency installation
        run: timeout -k 10 600 pnpm install --frozen-lockfile
      - name: canonical offline gate
        run: just check
      - name: native BB packaging
        working-directory: plugins/bb-plugin-exosurface
        env:
          BB_DATA_DIR: ${{ runner.temp }}/bb-data
        run: timeout -k 10 300 pnpm exec bb plugin build
